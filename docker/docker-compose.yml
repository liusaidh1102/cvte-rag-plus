include:
  - ./docker-compose-base.yml

services:
  app:
    depends_on:
      mysql:
        condition: service_healthy
    image: ${CVTE_RAG_PLUS_IMAGE}
    container_name: cvte-rag-plus-server
    ports:
      - ${SVR_HTTP_PORT}:9380
      - 80:80
      - 443:443
    volumes:
      - ./logs:${APP_ROOT:-/app}/logs
      - ./nginx/app.conf.template:/etc/nginx/conf.d/app.conf.template:ro
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    env_file: .env
    environment:
      # 以下地址只在容器内使用；宿主机上的同名变量指向 localhost。
      - MYSQL_HOST=mysql
      - ES_HOST=es01
      - REDIS_HOST=redis
      - MINIO_HOST=minio
      - TZ=${TIMEZONE}
      - HF_ENDPOINT=${HF_ENDPOINT}
      - MACOS=${MACOS}
    networks:
      - cvte-rag-plus
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 后台信息管理系统前端
  management-frontend:
    container_name: cvte-rag-plus-management-frontend
    image: ${CVTE_RAG_PLUS_MANAGEMENT_WEB_IMAGE}
    volumes:
      - ./nginx/management_nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8888:80"
    depends_on:
      - app
    env_file: .env
    environment:
      - API_BASE_URL=/api
      - TZ=${TIMEZONE}
    networks:
      - cvte-rag-plus
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

