# 本地代码构建 overlay —— 配合 docker-compose.yml 使用
# 用法（在 docker/ 目录下执行）：
#   docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file .env up -d --build
#
# 作用：为 app / management-frontend 补充 build 段，
#       让 up 命令直接基于本地最新代码构建镜像并启动，无需手动 docker build。
# 不带 -f docker-compose.build.yml 时，仍走原来的预构建镜像部署模式。
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        CVTE_RAG_PLUS_BASE_IMAGE: ${CVTE_RAG_PLUS_BASE_IMAGE}
        APP_ROOT: ${APP_ROOT:-/app}
    image: ${CVTE_RAG_PLUS_IMAGE}

  management-frontend:
    build:
      context: ../management
      dockerfile: Dockerfile
      target: frontend
    image: ${CVTE_RAG_PLUS_MANAGEMENT_WEB_IMAGE}

