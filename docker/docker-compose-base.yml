# 仅基础设施 Compose 文件：MySQL / Redis / MinIO / Elasticsearch / Kibana。
# 启动基础设施（不启动应用和管理后台）：
#   docker compose --env-file .env -f docker-compose-base.yml up -d mysql redis minio es01 kibana
# 应用容器请使用 docker/docker-compose.yml，不要与本地 Python/npm 进程同时启动。
services:
  es01:
    container_name: cvte-rag-plus-es-01
    profiles:
      - elasticsearch
    image: elasticsearch:${STACK_VERSION}
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    env_file: .env
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      # 显式限制 JVM 堆，避免 ES 默认按物理内存 50% 申请（16GB 主机上约 22GB 虚拟内存），
      # 从而在内存紧张时被 Docker VM 的 OOM Killer 优先杀掉（见 .env 中 MEM_LIMIT 的说明）。
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms2g -Xmx2g}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
      - TZ=${TIMEZONE}
    mem_limit: ${MEM_LIMIT}
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - cvte-rag-plus
    restart: on-failure

  kibana:
    container_name: cvte-rag-plus-kibana
    profiles:
      - elasticsearch
    # 版本必须与 es01 的 STACK_VERSION 保持一致
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION}
    volumes:
      - kibanadata:/usr/share/kibana/data
    ports:
      - ${KIBANA_PORT}:5601
    env_file: .env
    environment:
      - SERVERNAME=kibana
      - ELASTICSEARCH_HOSTS=http://es01:9200
      - ELASTICSEARCH_USERNAME=${KIBANA_USER:-kibana_system}
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD}
      - TZ=${TIMEZONE}
    mem_limit: ${KIBANA_MEM_LIMIT:-2g}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
    networks:
      - cvte-rag-plus
    depends_on:
      es01:
        condition: service_healthy
    restart: on-failure

  mysql:
    # mysql:5.7 linux/arm64 image is unavailable.
    image: mysql:8.0.39
    container_name: cvte-rag-plus-mysql
    env_file: .env
    # 限制单容器内存，避免某个组件无节制增长拖垮整个 Docker VM
    mem_limit: ${MYSQL_MEM_LIMIT:-2g}
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - TZ=${TIMEZONE}
    command:
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --tls_version="TLSv1.2,TLSv1.3"
      --init-file /data/application/init.sql
    ports:
      - ${MYSQL_PORT}:3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/data/application/init.sql
    networks:
      - cvte-rag-plus
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: on-failure

  minio:
    # MinIO 官方镜像已从 Docker Hub / quay.io 下架，改用兼容镜像 pgsty/silo
    image: pgsty/silo:latest
    container_name: cvte-rag-plus-minio
    command: server --console-address ":9001" /data
    # 限制单容器内存，避免某个组件无节制增长拖垮整个 Docker VM
    mem_limit: ${MINIO_MEM_LIMIT:-1g}
    ports:
      - ${MINIO_PORT}:9000
      - ${MINIO_CONSOLE_PORT}:9001
    env_file: .env
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
      # 浏览器直传需要 CORS 放行 PUT + Content-MD5（预检）
      - MINIO_API_CORS_ALLOW_ORIGIN=${MINIO_API_CORS_ALLOW_ORIGIN:-*}
      # 未完成 multipart 的自动清理（服务端扫描，比 S3 生命周期可靠）
      - MINIO_API_STALE_UPLOADS_EXPIRY=${MINIO_API_STALE_UPLOADS_EXPIRY:-24h}
      - MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL=${MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL:-1h}
      - TZ=${TIMEZONE}
    volumes:
      - minio_data:/data
    networks:
      - cvte-rag-plus
    restart: on-failure

  redis:
    # swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/valkey/valkey:8
    image: valkey/valkey:8
    container_name: cvte-rag-plus-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 128mb --maxmemory-policy allkeys-lru
    env_file: .env
    # 限制单容器内存，避免某个组件无节制增长拖垮整个 Docker VM
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    ports:
      - ${REDIS_PORT}:6379
    volumes:
      - redis_data:/data
    networks:
      - cvte-rag-plus
    restart: on-failure



volumes:
  esdata01:
    driver: local
  kibanadata:
    driver: local
  infinity_data:
    driver: local
  mysql_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  cvte-rag-plus:
    driver: bridge
